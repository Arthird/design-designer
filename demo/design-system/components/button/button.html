<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Button visual states</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="./component.css">
  </head>
  <body>
    <main class="preview">
      <h1 class="preview__header">Button</h1>
      <div class="preview__canvas">
        <button class="button" type="button">Primary action</button>
        <button class="button button--secondary" type="button">Secondary action</button>
        <button class="button" type="button">
          <svg class="button__icon" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M8 3v10M3 8h10" stroke-linecap="round"></path>
          </svg>
          Create item
        </button>
      </div>
    </main>
  </body>
</html>
