<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">

    <title>Button loading state</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="./component.css">
  </head>
  <body>
    <main class="preview">
      <h1 class="preview__header">Button: loading</h1>
      <div class="preview__canvas">

          <span class="button__spinner" aria-hidden="true"></span>
          Saving…
        </button>
      </div>
    </main>
  </body>
